<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#227c9d" />
      <stop offset="100%" stop-color="#0c2d3a" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#53b3d4" stroke-width="2.5" />
  
  <!-- Outer Subtle Orbit Ring -->
  <circle cx="32" cy="32" r="22" stroke="#53b3d4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Central Signature Sparkle Emblem -->
  <!-- 4-pointed dynamic conviction star -->
  <path d="M32 14 C32 24, 24 32, 14 32 C24 32, 32 40, 32 50 C32 40, 40 32, 50 32 C40 32, 32 24, 32 14 Z" 
        fill="url(#sparkleGrad)" 
        filter="url(#glow)" />

  <!-- Conviction Accent Dot (Orange #FF6B00) -->
  <circle cx="47" cy="17" r="4.5" fill="#FF6B00" stroke="#0c2d3a" stroke-width="1.5" />
</svg>
